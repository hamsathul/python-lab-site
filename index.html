<style>
/* Layout: a wide notebook. Code on the left, output on the right (stacked on phones). Sticky session tabs on top; each session reads ideas -> runnable cells -> quiz -> labs. */
:root {
  --bg: #F3F5F4;
  --surface: #FFFFFF;
  --sunk: #E9EEEC;
  --ink: #16211E;
  --muted: #5B6965;
  --line: #D3DCD8;
  --accent: #0E7A5F;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEFE8;
  --prompt: #A0590B;
  --good: #1D7A3A;
  --good-soft: #DFF2E4;
  --bad: #B3261E;
  --bad-soft: #FBE3E1;
  --warn-soft: #FFF2D6;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", "Courier New", Courier, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1513; --surface: #161E1B; --sunk: #1D2724; --ink: #E3ECE8; --muted: #9AABA5; --line: #2C3935;
    --accent: #3CC79F; --accent-ink: #06261C; --accent-soft: #163A30; --prompt: #E6A256;
    --good: #5FD08A; --good-soft: #15321F; --bad: #FF8A80; --bad-soft: #3A1A18; --warn-soft: #3A2E12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1513; --surface: #161E1B; --sunk: #1D2724; --ink: #E3ECE8; --muted: #9AABA5; --line: #2C3935;
  --accent: #3CC79F; --accent-ink: #06261C; --accent-soft: #163A30; --prompt: #E6A256;
  --good: #5FD08A; --good-soft: #15321F; --bad: #FF8A80; --bad-soft: #3A1A18; --warn-soft: #3A2E12;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
.theme-btn { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font: 500 0.85rem var(--font-body); color: var(--ink); background: var(--sunk); border: 1px solid var(--line); border-radius: 99px; padding: 7px 14px; cursor: pointer; min-height: 38px; }
.theme-btn:hover { border-color: var(--muted); }
.theme-btn svg { width: 16px; height: 16px; flex: none; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
code, pre, textarea, .mono { font-family: var(--font-mono); font-size: 0.875rem; }
p code, li code, td code, .task code { background: var(--sunk); padding: 0.05em 0.35em; border-radius: 4px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }

/* Header */
header.top { background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { padding-block: 22px 18px; display: grid; gap: 14px; }
.brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.brand h1 { font-size: clamp(1.6rem, 4.5vw, 2.2rem); font-weight: 800; letter-spacing: -0.01em; }
.brand h1 span { color: var(--accent); }
.brand .sub { color: var(--muted); font-size: 0.9rem; }
.progress { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; align-items: center; }
.bar { height: 10px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .4s ease; }
.progress .count { font-variant-numeric: tabular-nums; font-size: 0.9rem; color: var(--muted); }
.engine { font-size: 0.82rem; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--prompt); flex: none; }
.engine.ready .dot { background: var(--good); }
.engine.fail .dot { background: var(--bad); }

/* Tabs */
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
nav.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav.tabs .wrap::-webkit-scrollbar { display: none; }
nav.tabs button { flex: none; font: 500 0.9rem var(--font-body); color: var(--muted); background: none; border: 0; padding: 12px 12px 10px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs button:hover { color: var(--ink); }
nav.tabs .pct { font: 500 0.72rem var(--font-mono); color: var(--muted); background: var(--sunk); padding: 1px 6px; border-radius: 99px; }
nav.tabs .pct.full { background: var(--good-soft); color: var(--good); }

main .wrap { padding-block: 28px 80px; display: grid; gap: 36px; }
section.block { display: grid; gap: 14px; min-width: 0; }
.eyebrow { font: 600 0.75rem var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.session-head h2 { font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 800; }
h3.sec { font-size: 1.2rem; font-weight: 600; display: flex; align-items: baseline; gap: 10px; }
h3.sec small { font: 400 0.85rem var(--font-body); color: var(--muted); }
ul.ideas { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; max-width: 68ch; }

/* Notebook cell */
.cell { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-width: 0; }
.cell-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.cell-title { font-weight: 600; font-size: 0.92rem; }
.prompt { font: 500 0.8rem var(--font-mono); color: var(--prompt); }
.editor { display: block; width: 100%; min-height: 4.5em; resize: vertical; border: 0; outline: none; padding: 12px 14px; background: var(--sunk); color: var(--ink); line-height: 1.5; tab-size: 4; white-space: pre; overflow-x: auto; }
.editor:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
.io { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); }
.io label { font-size: 0.8rem; color: var(--muted); display: flex; align-items: center; gap: 8px; flex: 1 1 220px; min-width: 0; }
.io input[type=text] { flex: 1; min-width: 0; font: 0.85rem var(--font-mono); padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }
.btns { display: flex; gap: 6px; flex-wrap: wrap; }
button.btn { font: 500 0.85rem var(--font-body); padding: 7px 14px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
button.btn:hover { border-color: var(--muted); }

<script>
// Python runner: Pyodide (real CPython) in a Web Worker (/py-worker.js), so a stuck loop can be stopped without freezing the page.
// PyRun.run(code, inputLines, onNote) -> Promise of [{t, s}]; PyRun.stop() ends the current run and restarts Python.
(function () {
  var LIMIT_MS = 10000;
  var worker, ready = false, failed = false, queue = [], job = null, seq = 0, timer = null, listeners = [];
  function status(kind, info) { listeners.forEach(function (f) { f(kind, info); }); }
  function errChunk(msg, stopped) { return [{ t: "err", s: msg + "\n", short: msg, stopped: !!stopped }]; }
  function start() {
    ready = false;
    worker = new Worker("/py-worker.js");
    worker.onmessage = function (e) {
      var m = e.data;
      if (m.type === "ready") { ready = true; status("ready", m.version); next(); }
      else if (m.type === "failed") fail();
      else if (!job || m.id !== job.id) return;
      else if (m.type === "loading") { if (job.onNote) job.onNote("Loading " + m.what + ". The first time takes a few seconds…"); }
      else if (m.type === "started") { timer = setTimeout(function () { kill("Stopped after " + LIMIT_MS / 1000 + " seconds. Is this an infinite loop?"); }, LIMIT_MS); }
      else if (m.type === "result") {
        clearTimeout(timer);
        var j = job; job = null;
        if (m.fatal) restart(); else next();
        j.resolve(m.chunks);
      }
    };
    worker.onerror = function () { if (!ready) fail(); else if (job) kill("Python stopped unexpectedly."); };
  }
  function restart() { worker.terminate(); status("restart"); start(); }
  function fail() {
    failed = true; status("fail");
    var all = (job ? [job] : []).concat(queue); job = null; queue = [];
    all.forEach(function (j) { j.resolve(errChunk("Python couldn't start in this browser.")); });
  }
  function next() {
    if (job || !ready || !queue.length) return;
    job = queue.shift();
    worker.postMessage({ id: job.id, code: job.code, inputs: job.inputs });
  }
  function kill(msg) {
    clearTimeout(timer);
    var j = job; job = null;
    restart();
    if (j) j.resolve(errChunk(msg, true));
  }
  window.PyRun = {
    start: start,
    ready: function () { return ready; },
    onStatus: function (f) { listeners.push(f); },
    stop: function () {
      var waiting = queue; queue = [];
      waiting.forEach(function (j) { j.resolve(errChunk("Stopped.", true)); });
      if (job) kill("Stopped.");
    },
    run: function (code, inputs, onNote) {
      return new Promise(function (resolve) {
        if (failed) { resolve(errChunk("Python couldn't start in this browser.")); return; }
        queue.push({ id: ++seq, code: code, inputs: inputs || [], onNote: onNote, resolve: resolve });
        next();
      });
    }
  };
})();
</script>

            "A list holding an int, a float, a string and another list.",
            "mix[2] is 'Hello', so mix[2][0] is 'H'. mix[3] is [1, 2, 3], so mix[3][1] is 2.",
            "Slices work like strings: positions 3 to 6, then every 2nd item from 0 to 7.",

  { about: "b = a does not copy a list. It gives the same list a second name, so changing b changes a too. Use .copy() for a separate list.",

<script>
(function () {
  var C = window.COURSE;
  var KEY = "pyfoundations.v1";
  var state = { labs: {}, quiz: {}, drafts: {} };
  try { var saved = JSON.parse(localStorage.getItem(KEY) || "null"); if (saved) state = Object.assign(state, saved); } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  var execCount = 0;

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "class") n.className = attrs[k];
      else if (k === "html") n.innerHTML = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c != null) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }

  // ---------- progress ----------
  function quizId(sid, i) { return sid + ":" + i; }
  function sessionStats(sid) {
    var s = C.sessions.filter(function (x) { return x.id === sid; })[0];
    var labs = C.labs.filter(function (l) { return l.session === sid; });
    var lp = labs.filter(function (l) { return state.labs[l.id] === "pass"; }).length;
    var qr = s.quiz.filter(function (q, i) { return state.quiz[quizId(sid, i)] === q.a; }).length;
    return { labs: labs.length, labsDone: lp, quiz: s.quiz.length, quizDone: qr, total: labs.length + s.quiz.length, done: lp + qr };
  }
  function updateProgress() {
    var t = 0, d = 0;
    C.sessions.forEach(function (s) {
      var st = sessionStats(s.id); t += st.total; d += st.done;
      var pill = document.getElementById("pct-" + s.id);
      if (pill) { pill.textContent = st.done + "/" + st.total; pill.className = "pct" + (st.done === st.total ? " full" : ""); }
    });
    document.getElementById("pbar").style.width = (t ? (100 * d / t) : 0) + "%";
    document.getElementById("pcount").textContent = d + " of " + t + " done";
  }

  // ---------- running code ----------
  function renderOutput(pre, chunks) {
    pre.textContent = "";
    chunks.forEach(function (c) {
      var cls = c.t === "prompt" ? "out" : c.t;
      pre.appendChild(el("span", { class: cls, text: c.t === "val" ? c.s + "\n" : c.s }));
    });
    if (!chunks.length) pre.appendChild(el("span", { class: "note", text: "(ran with no output)" }));
    pre.scrollTop = 0;
    var pane = pre.closest ? pre.closest(".pane-out") : null;
    var meta = pane ? pane.querySelector(".out-meta") : null;
    if (meta) {
      var n = pre.textContent.replace(/\n$/, "").split("\n").length;
      meta.textContent = chunks.length ? n + (n === 1 ? " line" : " lines") + (n > 14 ? " · scroll for more" : "") : "";
    }
  }
  function parseInputs(str) {
    if (!str) return [];
    return str.split(/\s*\|\s*|\n/).filter(function (x, i, a) { return x !== "" || i < a.length - 1; });
  }
  function note(pre, text) { pre.textContent = ""; pre.appendChild(el("span", { class: "note", text: text })); }

  function runInto(code, inputs, pre) {
    note(pre, window.PyRun.ready() ? "Running…" : "Python is still loading. Your code will run as soon as it's ready.");
    return window.PyRun.run(code, inputs, function (msg) { note(pre, msg); }).then(function (res) { renderOutput(pre, res); return res; });
  }

  function editor(id, code) {
    var ta = el("textarea", { class: "editor", id: id, spellcheck: "false", autocapitalize: "off", autocomplete: "off", "aria-label": "Python code" });
    ta.value = code;
    function fit() { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight + 4, 560) + "px"; }
    ta.addEventListener("input", fit);
    ta.addEventListener("keydown", function (e) {
      if (e.key === "Tab" && !e.shiftKey) {
        e.preventDefault();
        var s = ta.selectionStart, en = ta.selectionEnd;
        ta.value = ta.value.slice(0, s) + "    " + ta.value.slice(en);
        ta.selectionStart = ta.selectionEnd = s + 4; fit();
      } else if (e.key === "Enter" && !e.ctrlKey && !e.metaKey && !e.shiftKey) {
        var pos = ta.selectionStart, before = ta.value.slice(0, pos);
        var line = before.split("\n").pop();
        var indent = (line.match(/^\s*/) || [""])[0];
        if (/:\s*$/.test(line)) indent += "    ";
        if (indent) {
          e.preventDefault();
          ta.value = before + "\n" + indent + ta.value.slice(ta.selectionEnd);
          ta.selectionStart = ta.selectionEnd = pos + 1 + indent.length; fit();
        }
      }
    });
    requestAnimationFrame(fit);
    return ta;
  }

  function annotated(code, notes) {
    var box = el("div", { class: "example annotated", role: "table", "aria-label": "Code with explanations" });
    code.split("\n").forEach(function (line, i) {
      var note = (notes || [])[i] || "";
      var row = el("div", { class: "ln" + (line.trim() ? "" : " blank"), role: "row" }, [
        el("code", { class: "ln-code", role: "cell", text: line || " " }),
        el("span", { class: "ln-note", role: "cell", text: note })
      ]);
      box.appendChild(row);
    });
    return box;
  }

  function codeCell(ex, idx, sid) {
    var cid = "ex-" + sid + "-" + idx;
    var info = window.NOTES && window.NOTES[sid] ? window.NOTES[sid][idx] : null;
    var ta = editor(cid, "");
    ta.setAttribute("placeholder", "Type the code above here (or click Copy to editor), then press Run");
    var prompt = el("span", { class: "prompt", text: "In [ ]:" });
    var out = el("pre", { class: "out", "aria-live": "polite" });
    var inp = el("input", { type: "text", id: cid + "-in", placeholder: "values for input(), separated by |", value: ex.inputs || "" });
    var needsInput = /input\s*\(/.test(ex.code);
    var running = false;
    function run() {
      if (running) { window.PyRun.stop(); return; }
      if (!ta.value.trim()) { note(out, "The editor is empty. Type the code shown above, or click Copy to editor."); return; }
      running = true; runBtn.textContent = "Stop"; runBtn.classList.add("stop");
      runInto(ta.value, parseInputs(inp.value), out).then(function () {
        running = false; runBtn.textContent = "Run"; runBtn.classList.remove("stop");
        prompt.textContent = "In [" + (++execCount) + "]:";
      });
    }
    ta.addEventListener("keydown", function (e) { if (e.key === "Enter" && (e.ctrlKey || e.metaKey || e.shiftKey)) { e.preventDefault(); if (!running) run(); } });
    var runBtn = el("button", { class: "btn primary runbtn", onclick: run, text: "Run" });
    var resetBtn = el("button", { class: "btn", text: "Clear", onclick: function () { ta.value = ""; ta.dispatchEvent(new Event("input")); out.textContent = ""; prompt.textContent = "In [ ]:"; } });
    var copyBtn = el("button", { class: "btn", text: "Copy to editor", onclick: function () { ta.value = ex.code; ta.dispatchEvent(new Event("input")); ta.focus(); } });
    return el("div", { class: "cell" }, [
      el("div", { class: "cell-head" }, [el("span", { class: "cell-title", text: ex.title }), prompt]),
      info && info.about ? el("p", { class: "about", text: info.about }) : null,
      el("div", { class: "stage" }, [el("span", { class: "stage-lbl", text: "1 · Code, line by line" }), copyBtn]),
      annotated(ex.code, info ? info.notes : []),
      el("div", { class: "panes" }, [
        el("div", { class: "pane-code" }, [
          el("div", { class: "stage" }, [el("span", { class: "stage-lbl", text: "2 · Your editor" })]),
          ta,
          el("div", { class: "io" }, [
            needsInput ? el("label", { for: cid + "-in" }, ["Input", inp]) : el("span", { style: "flex:1" }),
            el("div", { class: "btns" }, [resetBtn, runBtn])
          ])
        ]),
        el("div", { class: "pane-out" }, [
          el("div", { class: "stage" }, [el("span", { class: "stage-lbl", text: "3 · Output" }), el("span", { class: "out-meta" })]),
          out
        ])
      ])
    ]);
  }

  // ---------- quiz ----------
  function quizCard(q, i, sid) {
    var qid = quizId(sid, i);
    var box = el("div", { class: "q" });
    var opts = el("div", { class: "opts" });
    var why = el("div", { class: "why", hidden: "" });
    var retry = el("button", { class: "retry", hidden: "", text: "Try again", onclick: function () { delete state.quiz[qid]; save(); paint(); updateProgress(); } });
    function paint() {
      var chosen = state.quiz[qid];
      Array.prototype.forEach.call(opts.children, function (b, j) {
        b.className = ""; b.disabled = chosen !== undefined;
        if (chosen !== undefined) { if (j === q.a) b.className = "right"; else if (j === chosen) b.className = "wrong"; }
      });
      if (chosen !== undefined) {
        why.hidden = false;
        why.innerHTML = "<b>" + (chosen === q.a ? "Correct." : "Not quite.") + "</b>";
        why.appendChild(document.createTextNode(q.why));
        retry.hidden = chosen === q.a;
      } else { why.hidden = true; retry.hidden = true; }
    }
    q.opts.forEach(function (o, j) {
      opts.appendChild(el("button", { type: "button", text: o, onclick: function () { state.quiz[qid] = j; save(); paint(); updateProgress(); } }));
    });
    box.appendChild(el("div", { class: "qtext" }, [el("span", { class: "qnum", text: "Q" + (i + 1) }), el("span", { text: q.q })]));
    if (q.code) box.appendChild(el("pre", { text: q.code }));
    if (q.inputs) box.appendChild(el("div", { class: "qin", text: "User types: " + q.inputs.join(", ") }));
    box.appendChild(opts); box.appendChild(why); box.appendChild(retry);
    paint();
    return box;
  }

  // ---------- lab checking ----------
  function stripComments(src) { return src.split("\n").map(function (l) { return l.replace(/#.*$/, ""); }).join("\n"); }
  function numbersIn(text) { return (text.match(/-?\d+(?:\.\d+)?/g) || []).map(Number); }
  function hasNum(list, n) { return list.some(function (x) { return Math.abs(x - n) < 0.006; }); }

  function checkLab(lab, code) {
    var res = [];
    var src = stripComments(code);
    (lab.forbid || []).forEach(function (f) { if (src.indexOf(f) !== -1) res.push({ ok: false, msg: "The exercise asks you not to use " + f.replace("(", "()") }); });
    (lab.require || []).forEach(function (r) { if (!new RegExp("\\b" + r + "\\b").test(src)) res.push({ ok: false, msg: "Use a " + r + " loop for this one." }); });
    var tests = lab.tests.slice();
    function nextTest() {
      var t = tests.shift();
      if (!t) return Promise.resolve({ pass: res.every(function (r) { return r.ok; }), items: res });
      return window.PyRun.run(code, t.inputs).then(function (chunks) { judge(t, chunks); return nextTest(); });
    }
    function judge(t, chunks) {
      var label = t.inputs.length ? "With input " + t.inputs.join(", ") : "Output";
      var errs = chunks.filter(function (c) { return c.t === "err"; });
      if (errs.length) {
        res.push({ ok: false, msg: label + ": " + errs.map(function (c) { return c.short || c.s.trim(); }).join(" ") });
        if (errs.some(function (c) { return c.stopped; })) tests = [];
        return;
      }
      var text = chunks.filter(function (c) { return c.t === "out" || c.t === "val"; }).map(function (c) { return c.s; }).join("");
      var lines = text.split("\n").map(function (l) { return l.trim(); }).filter(function (l) { return l !== ""; });
      var problems = [];
      if (t.lines) {
        var joined = "\n" + lines.join("\n") + "\n";
        if (joined.indexOf("\n" + t.lines.join("\n") + "\n") === -1) problems.push("expected these lines: " + t.lines.join(" / "));
      }
      if (t.nums) {
        var found = numbersIn(text);
        var miss = t.nums.filter(function (n) { return !hasNum(found, n); });
        if (miss.length) problems.push("expected to see " + miss.join(", "));
      }
      (t.text || []).forEach(function (s) { if (text.indexOf(s) === -1) problems.push("expected to see \"" + s + "\""); });
      (t.re || []).forEach(function (r) { if (!new RegExp(r, "i").test(text)) problems.push("output doesn't match what was asked"); });
      (t.no || []).forEach(function (r) { if (new RegExp(r, "i").test(text)) problems.push("output says \"" + r + "\" when it shouldn't"); });
      if (t.order) {
        var last = -1, bad = false;
        t.order.forEach(function (r) { var m = new RegExp(r, "i").exec(text); if (!m || m.index < last) bad = true; else last = m.index; });
        if (bad) problems.push("the order isn't right");
      }
      if (t.firstLine && lines[0] !== t.firstLine) problems.push("first line should be " + t.firstLine);
      if (t.lastLine && lines[lines.length - 1] !== t.lastLine) problems.push("last line should be " + t.lastLine);
      if (t.lineCount && lines.length !== t.lineCount) problems.push("expected " + t.lineCount + " lines, got " + lines.length);
      problems = problems.filter(function (p, i, a) { return a.indexOf(p) === i; });
      res.push(problems.length ? { ok: false, msg: label + ": " + problems.join("; ") } : { ok: true, msg: label + ": correct" });
    }
    return nextTest();
  }
  window.__checkLab = checkLab;

  function labCard(lab) {
    var lid = "lab-" + lab.id.replace(".", "-");
    var chip = el("span", { class: "chip" });
    function paintChip() {
      var s = state.labs[lab.id];
      chip.className = "chip" + (s === "pass" ? " pass" : s === "tried" ? " tried" : "");
      chip.textContent = s === "pass" ? "Done" : s === "tried" ? "In progress" : "To do";
    }
    var task = el("div", { class: "task", html: lab.task });
    var card = el("div", { class: "cell lab", id: lid }, [
      el("div", { class: "cell-head" }, [el("span", { class: "cell-title" }, [el("span", { class: "prompt", text: "Lab " + lab.id + "  " }), lab.title]), chip]),
      task
    ]);
    var extra = el("div", { class: "extra", hidden: "" });
    function showExtra(kind) {
      extra.hidden = false; extra.textContent = "";
      if (kind === "hint") extra.appendChild(el("div", {}, [el("strong", { text: "Hint: " }), lab.hint]));
      else { extra.appendChild(el("strong", { text: "Model solution" })); extra.appendChild(el("pre", { text: lab.solution })); }
    }
    var ta = editor(lid + "-code", state.drafts[lab.id] != null ? state.drafts[lab.id] : (lab.starter || ""));
    ta.setAttribute("placeholder", "# Write your solution here");
    ta.style.minHeight = "7em";
    var timer;
    ta.addEventListener("input", function () { clearTimeout(timer); timer = setTimeout(function () { state.drafts[lab.id] = ta.value; save(); }, 400); });
    var inp = el("input", { type: "text", id: lid + "-in", placeholder: "values for input(), separated by |", value: lab.tests ? lab.tests[0].inputs.join(" | ") : "" });
    var out = el("pre", { class: "out", "aria-live": "polite" });
    var results = el("ul", { class: "results", "aria-live": "polite" });
    var solBtn = el("button", { class: "btn", text: "Show solution", onclick: function () { showExtra("sol"); } });
    if (lab.tests && !state.labs[lab.id]) { solBtn.disabled = true; solBtn.title = "Unlocks after your first check"; }
    var busy = false;
    var runBtn = el("button", { class: "btn", text: "Run", onclick: function () { if (busy) window.PyRun.stop(); else run(); } });
    var mainBtn = lab.tests
      ? el("button", { class: "btn primary", text: "Check", onclick: check })
      : el("button", { class: "btn primary", text: state.labs[lab.id] === "pass" ? "Marked done" : "Mark done", onclick: function () { state.labs[lab.id] = state.labs[lab.id] === "pass" ? undefined : "pass"; this.textContent = state.labs[lab.id] === "pass" ? "Marked done" : "Mark done"; save(); paintChip(); updateProgress(); } });
    function setBusy(b) { busy = b; runBtn.textContent = b ? "Stop" : "Run"; runBtn.classList.toggle("stop", b); mainBtn.disabled = b; }
    function run() {
      results.textContent = "";
      setBusy(true);
      runInto(ta.value, parseInputs(inp.value), out).then(function () { setBusy(false); });
    }
    function check() {
      out.textContent = ""; results.textContent = "";
      if (!ta.value.trim()) { results.appendChild(el("li", { class: "info", text: "Write some code first." })); return; }
      results.appendChild(el("li", { class: "info", text: window.PyRun.ready() ? "Checking…" : "Python is still loading. Checking as soon as it's ready…" }));
      setBusy(true);
      checkLab(lab, ta.value).then(function (r) {
        setBusy(false); results.textContent = "";
        r.items.forEach(function (it) { results.appendChild(el("li", { class: it.ok ? "ok" : "no", text: it.msg })); });
        if (r.pass) results.appendChild(el("li", { class: "info", text: "All checks passed. Compare with the model solution if you like." }));
        if (state.labs[lab.id] !== "pass") state.labs[lab.id] = r.pass ? "pass" : "tried";
        solBtn.disabled = false; solBtn.title = "";
        save(); paintChip(); updateProgress();
      });
    }
    ta.addEventListener("keydown", function (e) { if (e.key === "Enter" && (e.ctrlKey || e.metaKey || e.shiftKey)) { e.preventDefault(); if (!busy) run(); } });
    card.appendChild(el("div", { class: "panes" }, [
      el("div", { class: "pane-code" }, [
        el("div", { class: "stage" }, [el("span", { class: "stage-lbl", text: "Your solution" })]),
        ta,
        el("div", { class: "io" }, [
          /input\s*\(/.test(lab.solution) ? el("label", { for: lid + "-in" }, ["Input", inp]) : el("span", { style: "flex:1" }),
          el("div", { class: "btns" }, [
            el("button", { class: "btn", text: "Hint", onclick: function () { showExtra("hint"); } }),
            solBtn,
            runBtn,
            mainBtn
          ])
        ])
      ]),
      el("div", { class: "pane-out" }, [el("div", { class: "stage" }, [el("span", { class: "stage-lbl", text: "Output and checks" }), el("span", { class: "out-meta" })]), out, results, extra])
    ]));
    paintChip();
    return card;
  }

  // ---------- views ----------
  var view = document.getElementById("view");
  function sectionTitle(text, small) { return el("h3", { class: "sec" }, [text, small ? el("small", { text: small }) : null]); }

  function renderSession(s) {
    var labs = C.labs.filter(function (l) { return l.session === s.id; });
    var frag = document.createDocumentFragment();
    frag.appendChild(el("section", { class: "block session-head" }, [
      el("span", { class: "eyebrow", text: s.label }),
      el("h2", { text: s.title }),
      el("ul", { class: "ideas" }, s.ideas.map(function (h) { return el("li", { html: h }); }))
    ]));
    var exCards = el("div", { class: "cards" });
    var ex = el("section", { class: "block" }, [sectionTitle("Try it", "Read the code, type it in your editor, press Run (or Shift+Enter)"), exCards]);
    s.examples.forEach(function (e, i) { exCards.appendChild(codeCell(e, i, s.id)); });
    frag.appendChild(ex);
    var qz = el("section", { class: "block" }, [sectionTitle("Check yourself", "Predict first, then pick")]);
    var qwrap = el("div", { class: "quiz" });
    s.quiz.forEach(function (q, i) { qwrap.appendChild(quizCard(q, i, s.id)); });
    qz.appendChild(qwrap); frag.appendChild(qz);
    var lb = el("section", { class: "block" }, [sectionTitle("Labs", labs.length + (labs.length === 1 ? " exercise" : " exercises") + " with automatic checks")]);
    labs.forEach(function (l) { lb.appendChild(labCard(l)); });
    frag.appendChild(lb);
    return frag;
  }

  var CHEAT = [
    ["str", "'...'", "Yes", "No", "Yes", "upper lower strip count index isdigit isalpha"],
    ["list", "[...]", "Yes", "Yes", "Yes", "append extend insert remove pop sort reverse copy"],
    ["tuple", "(...)", "Yes", "No", "Yes", "index count"],
    ["dict", "{k: v}", "Insertion order", "Yes", "Keys unique", "keys values items, d[k] = v, del d[k]"],
    ["set", "{...}", "No", "Yes", "No", "add remove"]
  ];
  function renderOverview() {
    var frag = document.createDocumentFragment();
    frag.appendChild(el("section", { class: "block session-head" }, [
      el("span", { class: "eyebrow", text: "Overview" }),
      el("h2", { text: "Practise every session, then check your labs" }),
      el("div", { class: "howto" }, [
        el("p", { html: "Each session has short notes, code cells you can edit and run, quick questions and hands-on labs that check your answers. Python runs right here in your browser, so nothing needs installing." }),
        el("p", { html: "Run a cell with the Run button or <kbd>Shift</kbd>+<kbd>Enter</kbd>. When code asks for <code>input()</code>, type the values in the Input box, separated by <code>|</code>." }),
        el("p", { html: "Your progress and lab drafts are saved in this browser only." })
      ])
    ]));
    var g = el("div", { class: "grid-sessions" });
    C.sessions.forEach(function (s) {
      var st = sessionStats(s.id);
      g.appendChild(el("button", { class: "scard", type: "button", onclick: function () { go(s.id); } }, [
        el("span", { class: "lbl", text: s.label }),
        el("span", { class: "ttl", text: s.title }),
        el("span", { class: "stats", text: "Labs " + st.labsDone + "/" + st.labs + " · Questions " + st.quizDone + "/" + st.quiz }),
        el("span", { class: "bar" }, [el("i", { style: "width:" + (st.total ? 100 * st.done / st.total : 0) + "%" })])
      ]));
    });
    frag.appendChild(el("section", { class: "block" }, [sectionTitle("Sessions"), g]));
    var tbl = el("table", {}, [
      el("thead", {}, [el("tr", {}, ["Type", "Brackets", "Ordered", "Changeable", "Duplicates", "Key methods"].map(function (h) { return el("th", { text: h }); }))]),
      el("tbody", {}, CHEAT.map(function (r) { return el("tr", {}, r.map(function (c, i) { return el("td", {}, [i < 2 || i === 5 ? el("code", { text: c }) : c]); })); }))
    ]);
    frag.appendChild(el("section", { class: "block" }, [sectionTitle("Cheat sheet"), el("div", { class: "tablewrap" }, [tbl])]));
    var MIST = [
      ["n = input() then n + 1", "TypeError: input is a string", "n = int(input())"],
      ["s[0:3] for 4 characters", "Slice end is excluded", "s[0:4]"],
      ["if x = 5:", "SyntaxError", "if x == 5:"],
      ["b = a, then change b", "a changes too", "b = a.copy()"],
      ["lst = lst.sort()", "lst becomes None", "lst.sort()"],
      ["(5) as a tuple", "It's just 5", "(5,)"],
      ["{} as an empty set", "That's a dict", "set()"],
      ["while loop with no update", "Never ends", "i += 1 inside"]
    ];
    var t2 = el("table", {}, [
      el("thead", {}, [el("tr", {}, ["You wrote", "What happens", "Fix"].map(function (h) { return el("th", { text: h }); }))]),
      el("tbody", {}, MIST.map(function (r) { return el("tr", {}, [el("td", {}, [el("code", { text: r[0] })]), el("td", { text: r[1] }), el("td", {}, [el("code", { text: r[2] })])]); }))
    ]);
    frag.appendChild(el("section", { class: "block" }, [sectionTitle("Common mistakes"), el("div", { class: "tablewrap" }, [t2])]));
    frag.appendChild(el("button", { class: "btn resetall", type: "button", text: "Reset all progress", onclick: function () {
      if (this.dataset.armed) { state = { labs: {}, quiz: {}, drafts: {} }; save(); updateProgress(); go("overview"); }
      else { this.dataset.armed = "1"; this.textContent = "Click again to erase progress and drafts"; }
    } }));
    return frag;
  }

  // ---------- tabs ----------
  var tabs = document.getElementById("tabs");
  var TABS = [{ id: "overview", label: "Overview" }].concat(C.sessions.map(function (s) { return { id: s.id, label: s.label }; }));
  TABS.forEach(function (t) {
    var b = el("button", { role: "tab", type: "button", id: "tab-" + t.id, "aria-selected": "false", onclick: function () { go(t.id); } }, [t.label]);
    if (t.id !== "overview") b.appendChild(el("span", { class: "pct", id: "pct-" + t.id }));
    tabs.appendChild(b);
  });
  function go(id, noScroll) {
    var s = C.sessions.filter(function (x) { return x.id === id; })[0];
    if (!s) id = "overview";
    TABS.forEach(function (t) { document.getElementById("tab-" + t.id).setAttribute("aria-selected", t.id === id ? "true" : "false"); });
    view.textContent = "";
    view.appendChild(s ? renderSession(s) : renderOverview());
    try { history.replaceState(null, "", "#" + id); } catch (e) {}
    var tb = document.getElementById("tab-" + id); if (tb && tb.scrollIntoView) tb.scrollIntoView({ block: "nearest", inline: "nearest" });
    if (!noScroll) window.scrollTo(0, 0);
  }
  var start = (location.hash || "").replace("#", "");
  go(start || "overview", true);
  updateProgress();

  // ---------- theme ----------
  var root = document.documentElement;
  var themeBtn = document.getElementById("theme-btn");
  var SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  var MOON = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
  function currentTheme() {
    var t = root.getAttribute("data-theme");
    if (t) return t;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function paintThemeBtn() {
    var dark = currentTheme() === "dark";
    document.getElementById("theme-ico").innerHTML = dark ? SUN : MOON;
    document.getElementById("theme-lbl").textContent = dark ? "Light mode" : "Dark mode";
    themeBtn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
  }
  themeBtn.addEventListener("click", function () {
    var next = currentTheme() === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("pyfoundations.theme", next); } catch (e) {}
    paintThemeBtn();
  });
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", paintThemeBtn);
  }
  paintThemeBtn();

  // ---------- engine ----------
  var eng = document.getElementById("engine"), engText = document.getElementById("engine-text");
  window.PyRun.onStatus(function (kind, version) {
    if (kind === "ready") { eng.className = "engine ready"; engText.textContent = "Python " + version + " is ready. Type in any editor and press Run."; }
    else if (kind === "restart") { eng.className = "engine"; engText.textContent = "Restarting Python…"; }
    else { eng.className = "engine fail"; engText.textContent = "Python couldn't start in this browser, so Run and Check are off. Notes, questions and solutions still work."; }
  });
  window.PyRun.start();
})();

</script>
</body>
</html>
